version: "3"

tasks:
  build:
    desc: Build the takt binary, stamped with the plugin manifest's version.
    vars:
      VERSION:
        sh: go run ./internal/tools/setversion --print
    cmds:
      # go build ./... alone compiles and discards — a multi-package build
      # emits no binary — so it stays only as the compile check for every
      # other package; the binary itself needs an output and a main package.
      - go build ./...
      - go build -ldflags "-X github.com/monrad/takt/internal/version.Version={{.VERSION}}" -o takt ./cmd/takt

  test:
    desc: Run the test suite.
    cmds:
      - go test ./... -race -count=1

  lint:
    desc: Run golangci-lint.
    cmds:
      - golangci-lint run ./...

  check:
    desc: build + test + lint + host parity.
    cmds:
      - task: build
      - task: test
      - task: lint
      - task: hosts:check

  hosts:gen:
    desc: Regenerate hosts/copilot/agents/*.agent.md from agents/*.md.
    cmds:
      - go run ./internal/tools/hostgen

  hosts:check:
    desc: Fail when a generated host file is stale.
    cmds:
      - go run ./internal/tools/hostgen --check

  snapshot:
    desc: Build an unpublished release snapshot with goreleaser into dist/.
    cmds:
      # goreleaser is not a repo dependency and is not always installed. The
      # fallback is `nix develop`, which builds the devShell from flake.lock,
      # not `nix shell nixpkgs#goreleaser`, which resolves through the flake
      # registry to whatever rolling nixpkgs the machine happens to track —
      # a different goreleaser per machine and per day.
      - |
        if command -v goreleaser >/dev/null 2>&1; then
          goreleaser release --snapshot --clean --skip=publish
        else
          nix develop -c goreleaser release --snapshot --clean --skip=publish
        fi

  nix:build:
    desc: Build takt through the flake and print the version it stamped.
    cmds:
      - nix build .#default
      - ./result/bin/takt version

  version:set:
    desc: Rewrite the plugin manifests' version fields — VERSION=x.y.z.
    requires:
      vars: [VERSION]
    cmds:
      - go run ./internal/tools/setversion "{{.VERSION}}"
