version: "3"

tasks:
  build:
    desc: Build the takt binary.
    cmds:
      - go build ./...

  test:
    desc: Run the test suite.
    cmds:
      - go test ./... -race -count=1

  lint:
    desc: Run golangci-lint.
    cmds:
      - golangci-lint run ./...

  check:
    desc: build + test + lint.
    cmds:
      - task: build
      - task: test
      - task: lint

  snapshot:
    desc: Build an unpublished release snapshot with goreleaser into dist/.
    cmds:
      # goreleaser is not a repo dependency and is not always installed. The
      # fallback is `nix develop`, which builds the devShell from flake.lock,
      # not `nix shell nixpkgs#goreleaser`, which resolves through the flake
      # registry to whatever rolling nixpkgs the machine happens to track —
      # a different goreleaser per machine and per day.
      - |
        if command -v goreleaser >/dev/null 2>&1; then
          goreleaser release --snapshot --clean --skip=publish
        else
          nix develop -c goreleaser release --snapshot --clean --skip=publish
        fi

  nix:build:
    desc: Build takt through the flake and print the version it stamped.
    cmds:
      - nix build .#default
      - ./result/bin/takt version

  version:set:
    desc: Rewrite the plugin manifests' version fields — VERSION=x.y.z.
    requires:
      vars: [VERSION]
    cmds:
      - go run ./internal/tools/setversion "{{.VERSION}}"
