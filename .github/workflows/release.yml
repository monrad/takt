name: release

on:
  push:
    tags: ["v*"]

# Least privilege by default: only the job that publishes gets write.
permissions:
  contents: read

jobs:
  # A tag must clear the same gate a pull request does before anything is
  # published. `release` declares `needs: [check]`, so a red job here stops
  # the release rather than merely going red beside it.
  check:
    name: vet, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # First, and before setup-go: it needs nothing but jq and the checkout,
      # so a mistyped tag fails in seconds instead of after a lint and a race
      # run. `release` inherits it through `needs`.
      - name: Both plugin manifests must agree with the tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"

          # `task version:set` writes all three of these; the tag is the
          # fourth place the same number appears, and nothing but this gate
          # stops the four drifting apart.
          plugin="$(jq -r '.version' .claude-plugin/plugin.json)"
          market="$(jq -r '.version' .claude-plugin/marketplace.json)"
          entry="$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)"

          rc=0
          for pair in \
            "plugin.json .version:$plugin" \
            "marketplace.json .version:$market" \
            "marketplace.json .plugins[0].version:$entry"
          do
            where="${pair%%:*}"
            have="${pair##*:}"
            if [ "$have" != "$tag" ]; then
              echo "::error::.claude-plugin/$where says '$have' but tag ${GITHUB_REF_NAME} means '$tag'."
              rc=1
            fi
          done

          if [ "$rc" -ne 0 ]; then
            echo "::error::Run 'task version:set VERSION=$tag', commit the manifests, then move the tag."
            exit 1
          fi
          echo "plugin.json and marketplace.json both say $tag — matches tag ${GITHUB_REF_NAME}"

      - uses: actions/setup-go@v7
        with:
          # go.mod is the single source of the Go version (1.26).
          go-version-file: go.mod
          check-latest: true

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # .golangci.yml is the maratori golden config for this exact
          # version — keep the two in step.
          version: v2.13.1

      - name: go test
        run: go test ./... -race -count=1

  release:
    name: goreleaser
    runs-on: ubuntu-latest
    needs: [check]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser builds the changelog from history.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A repo secret the maintainer creates: a PAT with contents:write
          # on monrad/homebrew-tap. Without it the cask step cannot push.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
